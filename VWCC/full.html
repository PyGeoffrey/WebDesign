<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VWCC</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css">
        <style>
          /* I'm sorry for the long code :( */
          /* Apply the saved dark palette before page rendering to prevent a bright flash on reload. */
          html.dark-theme-preload,
          html.dark-theme-preload body {
              color-scheme: dark;
          }
          
          html.dark-theme-preload body {
              background: linear-gradient(135deg, #0d1624 0%, #18253a 100%);
          }
          
          :root {
              --ink: #17233a; /* Main text color. */
              --muted: #67748a; /* Secondary text and helper copy. */
              --line: #dbe3ef; /* Shared borders and dividers. */
              --paper: #f4f7fc; /* Main page surface. */
              --white: #ffffff; /* Raised cards and input backgrounds. */
              --green: #315fa8; /* Primary action and accent color. */
              --green-dark: #24487e; /* Darker accent for emphasis and hover states. */
              --green-soft: #dfe8f6; /* Low-contrast accent surface. */
              --gold: #d7a928; /* Secondary accent and editor action color. */
              --gold-soft: #f4e7b9; /* Low-contrast gold surface. */
              --editor-bg: #111c2c; /* Code editor background. */
              --editor-toolbar: #111c2c; /* Editor toolbar background. */
              --editor-text: #eaf1fb; /* Code editor and toolbar text. */
          }
          
          * {
              scrollbar-width: none;
          }
          
          *::-webkit-scrollbar {
              display: none;
          }
          
          .code-input,
          .code-highlight {
              resize: none;
              scrollbar-width: thin;
              scrollbar-color: var(--editor-text) var(--editor-bg);
          }
          
          .code-input::-webkit-scrollbar,
          .code-highlight::-webkit-scrollbar {
              width: 10px;
              height: 10px;
              display: block;
          }
          
          .code-input::-webkit-scrollbar-track,
          .code-highlight::-webkit-scrollbar-track {
              background: var(--editor-bg);
          }
          
          .code-input::-webkit-scrollbar-thumb,
          .code-highlight::-webkit-scrollbar-thumb {
              border: 2px solid var(--editor-bg);
              background: var(--editor-text);
          }
          
          .code-input::-webkit-scrollbar-thumb:hover,
          .code-highlight::-webkit-scrollbar-thumb:hover {
              background: var(--gold);
          }
          
          * { box-sizing: border-box; }
          
          body {
              min-height: 100vh;
              margin: 0;
              display: grid;
              place-items: center;
              padding: 24px;
              color: var(--ink);
              background:
                  radial-gradient(circle at 20% 15%, rgba(49, 95, 168, .10), transparent 18rem),
                  radial-gradient(circle at 82% 78%, rgba(215, 169, 40, .08), transparent 16rem),
                  linear-gradient(135deg, #edf3fb 0%, var(--paper) 100%);
          }
          
          .auth-container,
          .dashboard-card {
              width: min(440px, calc(100vw - 48px));
          }
          
          .dashboard-card {
              width: min(860px, calc(100vw - 48px));
          }
          
          .dashboard-header {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 20px;
          }
          
          .dashboard-kicker {
              margin: 0 0 4px;
              color: var(--green);
              font-size: 11px;
              font-weight: 800;
              letter-spacing: .12em;
              text-transform: uppercase;
          }
          
          .logout-button {
              width: auto;
              min-width: 100px;
              height: 44px;
          }
          
          .code-editor {
              overflow: hidden;
              border: 1px solid #cfdad4;
              border-color: var(--line);
              border-radius: 14px;
              background: var(--editor-bg);
              box-shadow: 0 16px 36px rgba(24, 55, 104, .14);
          }
          
          /* Keep the no-project prompt inside the same workspace footprint as the editor. */
          .empty-projects-state {
              min-height: 260px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 18px;
              border: 1px dashed var(--line);
              border-radius: 14px;
              color: var(--muted);
              background: rgba(255, 255, 255, .48);
              text-align: center;
          }
          
          .empty-projects-state[hidden] {
              display: none;
          }
          
          .empty-projects-state p {
              margin: 0;
              padding: 0 20px;
              color: var(--ink);
              font-size: 16px;
              font-weight: 700;
          }
          
          .empty-new-project-button {
              width: 48px;
              min-height: 48px;
              border: 1px solid var(--line);
              border-radius: 10px;
              color: var(--green-dark);
              background: var(--white);
              font-size: 28px;
          }
          
          .editor-toolbar {
              min-height: 48px;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              padding: 8px 10px 8px 16px;
              border-bottom: 1px solid rgba(255, 255, 255, .08);
              color: var(--editor-text);
              background: var(--editor-toolbar);
          }
          
          .editor-toolbar-leading {
              display: flex;
              align-items: center;
              gap: 12px;
          }
          
          /* Automatic HTML validator results are listed below the editor without replacing the source. */
          .code-diagnostics {
              max-height: 220px;
              overflow: auto;
              padding: 12px 16px;
              color: var(--editor-text);
              background: var(--editor-bg);
              border-top: 1px solid rgba(255, 255, 255, .1);
          }
          
          .code-diagnostics[hidden] {
              display: none;
          }
          
          .diagnostics-summary {
              margin: 0 0 8px;
              font-size: 12px;
              font-weight: 800;
          }
          
          .diagnostics-list {
              display: grid;
              gap: 5px;
              margin: 0;
              padding: 0;
              list-style: none;
          }
          
          .diagnostic-item {
              width: 100%;
              min-height: 34px;
              display: flex;
              align-items: baseline;
              gap: 8px;
              border: 0;
              border-left: 3px solid #df7777;
              border-radius: 3px;
              padding: 7px 9px;
              color: var(--editor-text);
              background: rgba(223, 119, 119, .12);
              text-align: left;
              font: 500 12px/1.45 system-ui, sans-serif;
              cursor: pointer;
          }
          
          .diagnostic-item.is-warning {
              border-left-color: var(--gold);
              background: rgba(215, 169, 40, .12);
          }
          
          .diagnostic-location {
              flex: 0 0 auto;
              opacity: .75;
              font-variant-numeric: tabular-nums;
          }
          
          /* Save-state badge: the data-state attribute selects the dot's color and animation. */
          .save-status {
              min-height: 26px;
              display: inline-flex;
              align-items: center;
              gap: 7px;
              padding: 0 9px;
              border: 1px solid rgba(255, 255, 255, .16);
              border-radius: 999px;
              color: var(--editor-text);
              background: rgba(255, 255, 255, .06);
              font: 600 11px/1 system-ui, sans-serif;
          }
          
          .save-status-indicator {
              width: 7px;
              height: 7px;
              flex: 0 0 7px;
              border-radius: 50%;
              background: #65b887;
          }
          
          .save-status[data-state="saving"] .save-status-indicator {
              background: var(--gold);
              animation: save-status-pulse .8s ease-in-out infinite alternate;
          }
          
          .save-status[data-state="error"] .save-status-indicator {
              background: #df7777;
          }
          
          @keyframes save-status-pulse {
              to { opacity: .35; }
          }
          
          .project-bar {
              min-height: 48px;
              display: flex;
              align-items: stretch;
              gap: 8px;
              padding: 6px 8px 0;
              overflow: hidden;
              border-bottom: 1px solid rgba(255, 255, 255, .08);
              background: var(--editor-bg);
          }
          
          /* Tabs expand to their names; the strip scrolls instead of truncating labels. */
          .project-tabs {
              min-width: 0;
              display: flex;
              align-items: stretch;
              gap: 4px;
              overflow-x: auto;
          }
          
          .project-tab {
              min-width: 120px;
              width: max-content;
              max-width: none;
              flex: 0 0 auto;
              display: flex;
              align-items: stretch;
              border: 1px solid transparent;
              border-bottom: 0;
              border-radius: 8px 8px 0 0;
              color: var(--editor-text);
              background: rgba(255, 255, 255, .06);
              cursor: grab;
          }
          
          .project-tab.is-dragging {
              display: none;
          }
          
          .project-tab-ghost {
              min-width: 120px;
              min-height: 38px;
              flex: 0 0 auto;
              display: flex;
              align-items: center;
              overflow: hidden;
              border: 1px dashed var(--gold);
              border-radius: 8px 8px 0 0;
              padding: 0 10px;
              color: var(--editor-text);
              background: rgba(215, 169, 40, .12);
              opacity: .8;
              text-overflow: ellipsis;
              white-space: nowrap;
              font: 600 12px system-ui, sans-serif;
              pointer-events: none;
          }
          
          .project-tab.is-active {
              border-color: rgba(255, 255, 255, .14);
              color: var(--ink);
              background: var(--white);
          }
          
          .project-tab-button,
          .project-close-button,
          .new-project-button {
              min-height: 38px;
              border: 0;
              border-radius: 0;
              color: inherit;
              background: transparent;
          }
          
          .project-tab-button {
              min-width: max-content;
              width: max-content;
              flex: 0 0 auto;
              overflow: visible;
              padding: 0 10px;
              text-align: left;
              text-overflow: clip;
              white-space: nowrap;
              font: 600 12px system-ui, sans-serif;
          }
          
          .project-close-button {
              width: 32px;
              flex: 0 0 32px;
              padding: 0;
              font: 600 18px/1 system-ui, sans-serif;
          }
          
          .project-tab-button:hover,
          .project-close-button:hover,
          .new-project-button:hover {
              background: rgba(215, 169, 40, .18);
          }
          
          .new-project-button {
              width: 38px;
              flex: 0 0 38px;
              align-self: center;
              min-height: 34px;
              margin-bottom: 5px;
              background-color: var(--muted);
              border: 1px solid rgba(255, 255, 255, .16);
              border-radius: 8px;
              color: var(--editor-text);
              font: 500 22px/1 system-ui, sans-serif;
          }
          
          /* This menu is positioned at the pointer only when a project tab is right-clicked. */
          .project-context-menu {
              position: fixed;
              z-index: 1200;
              min-width: 160px;
              padding: 5px;
              border: 1px solid var(--line);
              border-radius: 8px;
              background: var(--white);
              box-shadow: 0 10px 28px rgba(23, 35, 58, .24);
          }
          
          .project-context-menu[hidden] {
              display: none;
          }
          
          .project-context-menu button {
              width: 100%;
              min-height: 36px;
              display: block;
              border: 0;
              border-radius: 5px;
              padding: 0 10px;
              color: var(--ink);
              background: transparent;
              text-align: left;
              font: 600 13px system-ui, sans-serif;
          }
          
          .project-context-menu button:hover,
          .project-context-menu button:focus-visible {
              background: var(--green-soft);
          }
          
          .project-context-menu button:disabled {
              cursor: not-allowed;
              opacity: .45;
          }
          
          body.dark-theme .project-context-menu {
              border-color: var(--line);
              background: var(--white);
          }
          
          /* Shared modal surface for the display-name, rename, and delete-confirmation flows. */
          .project-dialog-backdrop[hidden] {
              display: none;
          }
          
          .project-dialog-backdrop {
              position: fixed;
              inset: 0;
              z-index: 1250;
              display: grid;
              place-items: center;
              padding: 20px;
              background: rgba(15, 25, 40, .52);
          }
          
          .project-dialog {
              width: min(400px, 100%);
              display: grid;
              gap: 14px;
              padding: 24px;
              border: 1px solid var(--line);
              border-radius: 12px;
              color: var(--ink);
              background: var(--white);
              box-shadow: 0 20px 60px rgba(0, 0, 0, .28);
          }
          
          .project-dialog h2,
          .project-dialog p {
              margin: 0;
          }
          
          .project-dialog h2 {
              font-size: 19px;
          }
          
          .project-dialog p {
              color: var(--muted);
              font-size: 14px;
          }
          
          .project-dialog-actions {
              display: flex;
              justify-content: flex-end;
              gap: 8px;
          }
          
          .project-dialog-actions button {
              min-height: 40px;
              border-radius: 8px;
              padding: 0 14px;
              cursor: pointer;
              font: 700 13px system-ui, sans-serif;
          }
          
          .project-dialog-actions .secondary-button {
              border: 1px solid var(--line);
              color: var(--ink);
              background: var(--white);
          }
          
          .project-dialog-actions .primary-button {
              border: 1px solid var(--green);
              color: white;
              background: var(--green);
          }
          
          .project-dialog-actions .delete-button {
              border-color: #b94b4b;
              background: #b94b4b;
          }
          
          .delete-confirm-option {
              display: inline-flex;
              align-items: center;
              gap: 9px;
              width: fit-content;
              color: var(--muted);
              font-size: 13px;
              font-weight: 600;
              cursor: pointer;
          }
          
          .delete-confirm-option[hidden] {
              display: none;
          }
          
          .delete-confirm-option input {
              width: 17px;
              height: 17px;
              margin: 0;
              accent-color: var(--green);
              cursor: pointer;
          }
          
          .code-input {
              width: 100%;
              min-height: 360px;
              resize: vertical;
              display: block;
              border: 0;
              outline: 0;
              padding: 20px;
              color: #dde9e3;
              background: var(--editor-bg);
              caret-color: var(--gold);
              font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              tab-size: 4;
          }
          
          .code-input::placeholder { color: #718078; }
          
          .auth-container {
              display: grid;
              gap: 12px;
              padding: 36px;
              border: 1px solid rgba(210, 220, 214, .9);
              border-radius: 22px;
              background: rgba(255, 255, 255, .94);
              box-shadow: 0 24px 70px rgba(31, 54, 44, .12);
              backdrop-filter: blur(14px);
          }
          
          .auth-title,
          .dashboard-title {
              margin: 8px 0 6px;
              color: var(--ink);
              font-size: 24px;
              line-height: 1.2;
              letter-spacing: -.035em;
          }
          
          .auth-input {
              width: 100%;
              height: 52px;
              border: 1px solid var(--line);
              border-radius: 12px;
              outline: none;
              padding: 0 16px;
              color: var(--ink);
              background: var(--white);
              font: 500 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
          }
          
          .auth-input::placeholder { color: #929c97; }
          
          .auth-input:focus {
              border-color: #7998ca;
              box-shadow: 0 0 0 4px rgba(49, 95, 168, .10);
              transform: translateY(-1px);
          }
          
          button,
          .auth-button,
          .theme-button,
          .run-button {
              min-height: 44px;
              border: 2px solid transparent;
              border-radius: 12px;
              cursor: pointer;
              font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              font-weight: 700;
              transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
          }
          
          button:focus-visible,
          .auth-button:focus-visible,
          .theme-button:focus-visible,
          .run-button:focus-visible {
              outline: 3px solid rgba(49, 95, 168, .22);
              outline-offset: 2px;
          }
          
          button:disabled,
          .auth-button:disabled,
          .theme-button:disabled,
          .run-button:disabled {
              cursor: not-allowed;
              opacity: .55;
              transform: none;
          }
          
          .auth-button {
              height: 52px;
              padding: 0 18px;
              font-size: 14px;
          }
          
          .theme-button {
              height: 44px;
              min-width: 72px;
              border: 2px solid var(--line);
              border-radius: 12px;
              padding: 0 14px;
              cursor: pointer;
              color: var(--green-dark);
              background: var(--white);
              font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
          }
          
          .run-button {
              height: 36px;
              min-width: 72px;
              border: 2px solid var(--gold);
              border-radius: 12px;
              padding: 0 14px;
              cursor: pointer;
              color: #17233a;
              background: var(--gold);
              font: 800 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          
          .auth-button:active,
          .theme-button:active,
          .run-button:active {
              transform: translateY(1px);
          }
          
          button:not(:disabled):hover,
          .auth-button:not(:disabled):hover,
          .theme-button:not(:disabled):hover,
          .run-button:not(:disabled):hover {
              transform: translateY(-2px);
          }
          
          button:not(:disabled):active,
          .auth-button:not(:disabled):active,
          .theme-button:not(:disabled):active,
          .run-button:not(:disabled):active {
              transform: translateY(0);
          }
          
          .primary-button:not(:disabled):hover {
              border-color: var(--green-dark);
              background: var(--green-dark);
              box-shadow: 0 12px 28px rgba(49, 95, 168, .24);
          }
          
          .secondary-button:not(:disabled):hover,
          .theme-button:not(:disabled):hover {
              border-color: #7998ca;
              background: var(--green-soft);
              box-shadow: 0 8px 18px rgba(49, 95, 168, .12);
          }
          
          .run-button:not(:disabled):hover {
              border-color: #e5c361;
              background: #e5c361;
              box-shadow: 0 8px 18px rgba(215, 169, 40, .20);
          }
          
          .primary-button {
              color: var(--white);
              border-color: var(--green);
              background: var(--green);
              box-shadow: 0 10px 24px rgba(49, 95, 168, .18);
          }
          
          .secondary-button,
          .theme-button {
              color: var(--green-dark);
              border: 2px solid var(--line);
              background: var(--white);
          }
          
          .secondary-button:hover,
          .theme-button:hover {
              border-color: #7998ca;
              background: var(--green-soft);
          }
          
          .run-button {
              color: #17233a;
              border-color: var(--gold);
              background: var(--gold);
          }
          
          .run-button:hover {
              border-color: #e5c361;
              background: #e5c361;
          }
          
          .dashboard-card {
              display: grid;
              gap: 14px;
              padding: 42px;
              border: 1px solid var(--line);
              border-radius: 22px;
              background: var(--white);
              box-shadow: 0 24px 70px rgba(31, 54, 44, .12);
          }
          
          .dashboard-title {
              margin: 0;
              font-size: 30px;
          }
          
          .welcome-message {
              margin: 0 0 12px;
              color: var(--muted);
          }
          
          .dashboard-card .secondary-button { width: 100%; }
          
          .dashboard-actions {
              display: flex;
              align-items: center;
              gap: 8px;
          }
          
          .theme-button {
              height: 44px;
              min-width: 72px;
              border: 2px solid var(--line);
              border-radius: 12px;
              padding: 0 14px;
              cursor: pointer;
              color: var(--green-dark);
              background: var(--white);
              font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
              transition: background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
          }
          
          .theme-button:hover {
              border-color: #7998ca;
              background: var(--green-soft);
              box-shadow: 0 8px 18px rgba(49, 95, 168, .12);
          }
          
          .theme-button:active { transform: translateY(1px); }
          
          /* Override the shared palette when dark-theme is added to the body. */
          body.dark-theme {
              --ink: #bfcbe0; /* Main text color in dark mode. */
              --muted: #929fb5; /* Secondary text in dark mode. */
              --line: #344762; /* Borders and dividers in dark mode. */
              --paper: #0d1624; /* Main page surface in dark mode. */
              --white: #18253a; /* Raised cards and input backgrounds in dark mode. */
              --green: #82a8df; /* Primary action and accent in dark mode. */
              --green-dark: #b7cbed; /* Stronger accent in dark mode. */
              --green-soft: #263a58; /* Low-contrast accent surface in dark mode. */
              --gold: #d9b84f; /* Gold accent in dark mode. */
              --gold-soft: #514627; /* Low-contrast gold surface in dark mode. */
              --editor-bg: #d6dfec; /* Code editor background in dark mode's palette. */
              --editor-toolbar: #cbd6e5; /* Editor toolbar surface in dark mode's palette. */
              --editor-text: #27364d; /* Code and toolbar text in dark mode's palette. */
              background:
                  radial-gradient(circle at 20% 15%, rgba(130, 168, 223, .09), transparent 18rem),
                  radial-gradient(circle at 82% 78%, rgba(217, 184, 79, .07), transparent 16rem),
                  linear-gradient(135deg, #0d1624 0%, #18253a 100%);
          }
          
          body.dark-theme .auth-container,
          body.dark-theme .dashboard-card {
              border-color: var(--line);
              background: rgba(24, 37, 58, .96);
              box-shadow: 0 24px 70px rgba(0, 0, 0, .32);
          }
          
          body.dark-theme .auth-input {
              color: var(--ink);
              background: #1d2d47;
          }
          
          body.dark-theme .primary-button {
              color: #0d1624;
          }
          
          body.dark-theme .editor-language {
              color: var(--editor-text);
          }
          
          body.dark-theme .code-editor,
          body.dark-theme .code-editor-area {
              border-color: #344762;
          }
          
          body.dark-theme .code-highlight code,
          body.dark-theme .code-highlight {
              text-shadow: none;
          }
          
          body.dark-theme .editor-output {
              background: #cbd6e5;
          }
          
          body.dark-theme .output-heading {
              background: #b8c5d7;
              color: #37475f;
          }
          
          .remember-option {
              display: inline-flex;
              align-items: center;
              gap: 9px;
              width: fit-content;
              color: var(--muted);
              font-size: 13px;
              font-weight: 600;
              cursor: pointer;
          }
          
          .remember-option input {
              width: 17px;
              height: 17px;
              margin: 0;
              accent-color: var(--green);
              cursor: pointer;

              position: relative;
              min-height: 360px;
              overflow: hidden;
              background: #111c2c;
          }
          
          /* The transparent textarea and Prism layer must share metrics to keep the caret aligned. */
          .code-highlight,
          .code-input {
              position: absolute;
              inset: 0;
              width: 100%;
              height: 100%;
              min-height: 360px;
              margin: 0 !important;
              border: 0;
              padding: 21px 20px 20px;
              white-space: pre-wrap;
              overflow-wrap: normal;
              tab-size: 4;
              line-height: 24px;
              font: 500 14px/24px "JetBrains Mono", monospace;
          }
          
          .code-highlight {
              z-index: 1;
              overflow: auto;
              pointer-events: none;
              background: transparent;
          }
          
          .code-highlight code {
              font: inherit;
              line-height: inherit;
              white-space: inherit;
              tab-size: inherit;
          }
          
          .code-input {
              z-index: 2;
              resize: vertical;
              display: block;
              outline: 0;
              color: transparent;
              background: transparent;
              caret-color: #89cbaa;
              -webkit-text-fill-color: transparent;
          }
          
          .code-input::selection {
              background: rgba(137, 203, 170, .28);

          }
          
          .code-editor-area .code-highlight,
          .code-editor-area .code-input {
              padding: 21px 20px 20px;
              white-space: pre-wrap;
              tab-size: 4;
              line-height: 24px;
              font: 500 14px/24px "JetBrains Mono", monospace;
          }
          
          .code-editor-area .code-highlight code {
              white-space: inherit;
              tab-size: inherit;
              font: inherit;

          .loading-screen {
              position: fixed;
              inset: 0;
              z-index: 1000;
              display: grid;
              place-items: center;
              visibility: hidden;
              opacity: 0;
              background: rgba(244, 247, 252, .82);

          .loading-screen.is-loading {
              visibility: visible;

          .loading-content {
              display: grid;

          .loading-content p {
              margin: 0;

          .loading-spinner {
              width: 54px;
              height: 54px;

              border-top-color: var(--gold);
              border-right-color: var(--green);
              border-radius: 50%;

          body.dark-theme .loading-screen {
              background: rgba(13, 22, 36, .88);

          body.dark-theme .loading-content {

              to { transform: rotate(360deg); }

          .code-editor,
          .auth-container,
          .auth-input,

          .theme-button,

          .editor-toolbar,
          .editor-output,

          }
          
          .popup-stack {
              position: fixed;
              right: 24px;
              bottom: 24px;
              z-index: 1300;
              width: min(380px, calc(100vw - 48px));
              display: flex;
              flex-direction: column;
              gap: 10px;
          }
          
          .popup {
              position: relative;
              width: 100%;
              max-width: none;
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 12px;
              min-height: 58px;
              padding: 12px 12px 12px 16px;
              border: 3px solid var(--line);
              border-radius: 12px;
              color: var(--ink);
              background: var(--white);
              box-shadow: 0 14px 36px rgba(23, 35, 58, .28);
              transition: opacity .18s ease, transform .18s ease;
              transform: translateX(0);
          }
          
          .popup.is-visible {
              visibility: visible;
              opacity: 1;
              animation: popup-slide-in .24s ease-out forwards;
          }
          
          .popup.is-leaving {
              animation: popup-slide-out .24s ease-in forwards;
          }
          
          @keyframes popup-slide-in {
              from { opacity: 0; transform: translateX(110%); }
              to { opacity: 1; transform: translateX(0); }
          }
          
          @keyframes popup-slide-out {
              from { opacity: 1; transform: translateX(0); }
              to { opacity: 0; transform: translateX(110%); }
          }
          
          .popup.is-error {
              border-color: #c96b6b;
              background: #fff4f4;
          }
          
          .popup.is-success {
              border-color: var(--green);
          }
          
          .popup-close {
              width: 34px;
              height: 34px;
              min-height: 34px;
              flex: 0 0 34px;
              border: 0;
              border-radius: 0;
              padding: 0;
              cursor: pointer;
              color: var(--ink);
              background: transparent;
              font: 700 20px/30px system-ui, sans-serif;
          }
          
          body.dark-theme .popup {
              border-color: var(--line);
              background: #18253a;
              box-shadow: 0 14px 36px rgba(0, 0, 0, .42);
          }
          
          body.dark-theme .popup.is-error {

              background: #38272c;
          }
          
          body.dark-theme .popup.is-success {
              border-color: var(--gold);
          }
          
          body.dark-theme .popup-close {
              border: 0;
              color: var(--ink);
              background: transparent;
          }
          
          @media (max-width: 520px) {
              body { align-items: start; padding: 14px; }
          
              .auth-container,
              .dashboard-card {
                  width: calc(100vw - 28px);
                  border-radius: 18px;
              }
          
              .auth-container { padding: 24px 20px; }
              .dashboard-card { padding: 22px 16px; }
          
              .dashboard-header { align-items: flex-start; }
              .logout-button { min-width: 82px; }
              .code-input { min-height: 300px; }
          
              .dashboard-actions { gap: 6px; }
              .theme-button { min-width: 64px; }
          
              .page-theme-button {
                  top: 14px;

              }

          .repository-notice {
              margin: 0;
              padding: 12px 14px;
              border: 2px solid var(--gold);
              border-radius: 10px;
              color: var(--ink);
              background: var(--gold-soft);
              font: 700 13px system-ui, sans-serif;
          }
          
          body,

              font-family: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          }
          
          .code-editor,
          .code-editor * {
              font-family: "JetBrains Mono", monospace;
          }
          
          .page-theme-button {
              position: fixed;
              top: 24px;
              right: 24px;
              z-index: 1200;
          }
          
          .auth-container,
          .dashboard-card,
          .auth-input,
          .code-editor,
          .editor-toolbar,
          .editor-output,
          .output-heading,
          .popup,
          .popup-close {
              transition:
                  color .24s ease,
                  background-color .24s ease,
                  border-color .24s ease,
                  box-shadow .24s ease;
          }
          
          .auth-form {
              display: grid;
              gap: 12px;
          }
          
          .auth-form + .auth-form {
              margin-top: 12px;
              padding-top: 24px;
              border-top: 1px solid var(--line);
          }
        </style>
    </head>
    <body>
        <div id="loadingScreen" class="loading-screen is-loading" role="status" aria-live="polite" aria-hidden="false">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p>Working...</p>
            </div>
        </div>

        <button class="theme-button page-theme-button" id="themeButton" type="button" aria-label="Switch to dark theme">⏾&nbsp;Dark</button>

        <!-- Separate forms preserve native Enter submission and password-manager support. -->
        <div id="authContainer" class="auth-container">
            <form id="signupForm" class="auth-form">
                <h1 class="auth-title">Sign Up</h1>
                <input class="auth-input" id="signupUsername" name="name" type="text" placeholder="Display Name" autocomplete="name" />
                <input class="auth-input" id="signupEmail" name="email" type="email" placeholder="Email" autocomplete="email" required />
                <input class="auth-input" id="signupPassword" name="password" type="password" placeholder="Password" autocomplete="new-password" required />
                <button class="auth-button primary-button" id="signupButton" type="submit">Sign Up</button>
            </form>

            <form id="loginForm" class="auth-form">
                <h1 class="auth-title">Log In</h1>
                <input class="auth-input" id="loginEmail" name="email" type="email" placeholder="Email" autocomplete="username" required />
                <input class="auth-input" id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
                <label class="remember-option" for="rememberMe">
                    <input id="rememberMe" name="remember-me" type="checkbox" />
                    <span>Remember me</span>
                </label>
                <button class="auth-button secondary-button" id="loginButton" type="submit">Log In</button>
            </form>
        </div>

        <!-- The workspace switches between project tabs and the empty-project prompt. -->
        <div id="dashboard" class="dashboard-card" style="display: none;">
            <div class="dashboard-header">
                <div>
                    <p class="dashboard-kicker">Code Vault</p>
                    <h1 class="dashboard-title">Dashboard</h1>
                </div>
                <div class="dashboard-actions">
                    <button class="auth-button secondary-button logout-button" id="logoutButton">Log Out</button>
                </div>
            </div>

            <p class="welcome-message" id="welcomeMessage">Welcome!</p>
            <p class="repository-notice" id="repositoryNotice" style="display: none;"></p>

            <section class="code-editor" aria-label="Code editor">
                <div class="project-bar">
                    <div class="project-tabs" id="projectTabs" role="tablist" aria-label="Projects"></div>
                    <button class="new-project-button" id="newProjectButton" type="button" aria-label="New project" title="New project">+</button>
                </div>
                <div class="editor-toolbar">
                    <div class="editor-toolbar-leading">
                        <span class="editor-language">HTML</span>
                        <span class="save-status" id="saveStatus" data-state="saved" role="status" aria-live="polite">
                            <span class="save-status-indicator" aria-hidden="true"></span>
                            <span class="save-status-label">Saved</span>
                        </span>
                    </div>
                    <button class="run-button" id="runCodeButton" type="button">Run</button>
                </div>
                <div class="code-editor-area">
                    <pre class="code-highlight" aria-hidden="true"><code class="language-markup"></code></pre>
                    <textarea class="code-input" aria-label="Code" spellcheck="false" autocomplete="off">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
    &lt;title&gt;My Project&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
    &lt;h1&gt;Hello, World!&lt;/h1&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                </div>
                <section id="codeDiagnostics" class="code-diagnostics" aria-label="HTML diagnostics" aria-live="polite" hidden>
                    <p class="diagnostics-summary"></p>
                    <ol class="diagnostics-list"></ol>
                </section>
                <div class="editor-output">
                    <div class="output-heading">Output</div>
                    <!-- The sandbox lets scripts run in the preview without granting page-level access. -->
                    <iframe class="code-output" title="Code output" sandbox="allow-scripts"></iframe>
                </div>
            </section>
            <section id="emptyProjectsState" class="empty-projects-state" aria-label="No projects" hidden>
                <p>Press the + button to get started coding!</p>
                <button class="new-project-button empty-new-project-button" id="emptyNewProjectButton" type="button" aria-label="Create your first project" title="Create your first project">+</button>
            </section>
        </div>

        <!-- Shared project actions and dialogs are positioned outside the dashboard layout. -->
        <div id="projectContextMenu" class="project-context-menu" role="menu" aria-label="Project actions" hidden>
            <button type="button" role="menuitem" data-project-action="move-left">Move left</button>
            <button type="button" role="menuitem" data-project-action="move-right">Move right</button>
            <button type="button" role="menuitem" data-project-action="rename">Rename</button>
            <button type="button" role="menuitem" data-project-action="delete">Delete</button>
        </div>

        <div id="projectDialog" class="project-dialog-backdrop" hidden>
            <form id="projectDialogForm" class="project-dialog" role="dialog" aria-modal="true" aria-labelledby="projectDialogTitle">
                <h2 id="projectDialogTitle"></h2>
                <p id="projectDialogMessage"></p>
                <input id="projectNameInput" class="auth-input" type="text" maxlength="40" autocomplete="off" aria-label="Name" placeholder="Enter a name" hidden>
                <label id="skipDeleteConfirmationOption" class="delete-confirm-option" hidden>
                    <input id="skipDeleteConfirmation" type="checkbox">
                    <span>Don't show again</span>
                </label>
                <div class="project-dialog-actions">
                    <button id="projectDialogCancel" class="secondary-button" type="button">Cancel</button>
                    <button id="projectDialogConfirm" class="primary-button" type="submit">Save</button>
                </div>
            </form>
        </div>

        <div id="popupStack" class="popup-stack" aria-live="polite" aria-label="Notifications"></div>

        <!-- Load global libraries first because app.js uses their browser globals immediately. -->
        <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.1.0/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-markup.min.js"></script>
        <script>
          // Sorry again :(((((
          // Get Supabase's client factory from the CDN script loaded by index.html.
          const { createClient } = supabase;
          
          // Project URL identifies the Supabase backend this page connects to.
          const supabaseUrl = "https://tswxwpneritewlqwjrtb.supabase.co";
          // This public anonymous key identifies the browser client; Supabase policies still control access.
          const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRzd3h3cG5lcml0ZXdscXdqcnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MzgzOTIsImV4cCI6MjExMTExNDM5Mn0.bB_QirDDf-h1hvGfgbo8w9kpa6rI0BBzsEI2aPjd_XA";
          
          // Reuse this client for all authentication and session requests.
          const supabaseClient = createClient(supabaseUrl, supabaseKey);
          
          console.log("Supabase connected.", supabaseClient);
          
          // isLoading: true shows the overlay; false hides it and re-enables authentication buttons.
          // Toggle the progress overlay and disable authentication buttons during network work.
          function setLoading(isLoading) {
              const loadingScreen = $("#loadingScreen"); // jQuery handle for the page-wide loading element.
              loadingScreen.toggleClass("is-loading", isLoading);
              // Tell screen readers whether the overlay is currently active.
              loadingScreen.attr("aria-hidden", isLoading ? "false" : "true");
              $(".auth-button").prop("disabled", isLoading);
          }
          
          // query: a function that performs one Supabase operation and returns its promise.
          // Run a Supabase request with visible loading feedback for at least half a second.
          async function runSupabaseQuery(query) {
              setLoading(true);
          
              // Let the browser paint the overlay before starting the request.
              await new Promise(resolve => requestAnimationFrame(resolve));
          
              const startedAt = performance.now(); // Used to calculate how long the request took.
          
              try {
                  const result = await query(); // The caller supplies the specific Supabase operation.
                  const elapsed = performance.now() - startedAt; // Actual request duration in milliseconds.
          
                  if (elapsed < 500) {
                      // Avoid a brief flash by filling the remainder of the minimum display time.
                      await new Promise(resolve => setTimeout(resolve, 500 - elapsed));
                  }
          
                  return result;
              } finally {
                  setLoading(false);
              }
          }
          
          // Process sign-up through the form event so clicking or pressing Enter both work.
          $("#signupForm").on("submit", async function(event) {
              // Stop the browser's normal page reload; JavaScript handles the request instead.
              event.preventDefault();
          
              const display_name = $("#signupUsername").val(); // Name saved as Supabase user metadata.
              const email = $("#signupEmail").val(); // Email address for the new account.
              const password = $("#signupPassword").val(); // Sent to Supabase; it is not saved by this script.
          
              // Run the sign-up request through the shared loading indicator.
              // Supabase returns data on success or error details when the request fails.
              const { data, error } = await runSupabaseQuery(() =>
                  supabaseClient.auth.signUp({ email, password, options: { data: { display_name } } })
              );
              if (error) {
                  console.error("Error signing up:", error.message);
                  showPopup("Error signing up: " + error.message, "error");
              } else {
                  console.log("Sign up successful:", data);
                  showPopup("Signup successful!");
                  // Replace the forms with the dashboard after successful account creation.
                  $("#authContainer").hide();
                  $("#dashboard").show();
                  await showDashboard(data.user);
              }
          });
          
          // Process login as an async form submission while retaining Enter-key support.
          $("#loginForm").on("submit", async function(event) {
              event.preventDefault();
          
              const email = $("#loginEmail").val(); // Read the account email from the form.
              const password = $("#loginPassword").val(); // Read the password for this sign-in attempt.
          
              // Ask Supabase to verify the credentials while the loading overlay is visible.
              // data contains the signed-in user; error contains a message if credentials are rejected.
              const { data, error } = await runSupabaseQuery(() =>
                  supabaseClient.auth.signInWithPassword({ email, password })
              );
              if (error) {
                  console.error("Error logging in:", error.message);
                  showPopup("Error logging in: " + error.message, "error");
              } else {
                  console.log("Login successful:", data);
                  showPopup("Signed in.");
                  if (rememberMe.is(":checked")) {
                      // Remember only the email; password storage is handled by the browser's password manager.
                      //localStorage.setItem("vwcc-remembered-email", email);
                      //localStorage.setItem("vwcc-remember-me", "true");
                  } else {
                      //localStorage.removeItem("vwcc-remembered-email");
                      //localStorage.removeItem("vwcc-remember-me");
                  }
                  // Replace the forms with the dashboard after successful authentication.
                  $("#authContainer").hide();
                  $("#dashboard").show();
                  await showDashboard(data.user);
              }
          });
          
          // Sign out remotely, then clear remembered-login state and return to the forms.
          $("#logoutButton").click(async function() {
              // Sign-out returns an error only when Supabase could not complete the request.
              const { error } = await runSupabaseQuery(() =>
                  supabaseClient.auth.signOut()
              );
              if (error) {
                  console.error("Error logging out:", error.message);
                  showPopup("Error logging out: " + error.message, "error");
              } else {
                  console.log("Logout successful.");
                  showPopup("You have been logged out.");
                  // Explicit logout removes the saved email and Remember Me preference.
                  //localStorage.removeItem("vwcc-remembered-email");
                  //localStorage.removeItem("vwcc-remember-me");
                  $("#rememberMe").prop("checked", false);
                  $("#loginEmail").val("");
                  $("#loginPassword").val("");
                  $("#authContainer").show();
                  $("#dashboard").hide();
                  stopProjectSync();
              }
          });
          
          const themeButton = $("#themeButton"); // Button the user clicks to switch themes.
          const savedTheme = "light"; // Theme selected during an earlier visit.
          
          // theme: either "dark" or "light", used to select the page's color palette.
          // Apply theme classes and update the button label to match the active mode.
          function applyTheme(theme) {
              const dark = theme === "dark"; // Convert the theme name into a boolean for DOM updates.
              $("body").toggleClass("dark-theme", dark);
              $("html").toggleClass("dark-theme-preload", dark);
              themeButton.html(dark ? "☀&nbsp;Light" : "⏾&nbsp;Dark");
              themeButton.attr("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
          }
          
          // Restore the saved choice, or use light mode for a first-time visitor.
          applyTheme(savedTheme || "light");
          
          // Toggle the theme and save the new choice for the next page load.
          themeButton.click(function() {
              const nextTheme = $("body").hasClass("dark-theme") ? "light" : "dark"; // Choose the opposite of the current mode.
              applyTheme(nextTheme);
              //localStorage.setItem("vwcc-theme", nextTheme);
          });
          
          const rememberMe = $("#rememberMe"); // Checkbox that controls local email remembering.
          const rememberedEmail = null; // Address saved by a previous opt-in.
          
          if (rememberedEmail) {
              // Prefill only the email; passwords remain under browser password-manager control.
              $("#loginEmail").val(rememberedEmail);
              rememberMe.prop("checked", true);
          }
          
          rememberMe.on("change", function() {
              if (!rememberMe.is(":checked")) {
              // Unchecking the option immediately removes its saved email and preference.
                  //localStorage.removeItem("vwcc-remembered-email");
                  //localStorage.removeItem("vwcc-remember-me");
              }
          });
          
          // user: authenticated Supabase user object containing ID, email, and metadata.
          // Show account-specific dashboard messages and load this account's browser-local projects.
          async function showDashboard(user) {
              const displayNameKey = "vwcc-local-display-name-" + user.id; // Store each account's alias under its unique ID.
              const savedDisplayName = null; // Treat blank aliases as missing.
              const welcomeMessage = $("#welcomeMessage"); // Element used for the temporary greeting.
              const repositoryNotice = $("#repositoryNotice"); // Special notice for the main repository account.
              const isMainAccount = user.email?.toLowerCase() === "main@frame.com"; // Compare emails without case sensitivity.
          
              clearTimeout(window.welcomeMessageTimer);
              welcomeMessage.stop(true).hide().text("");
          
              if (isMainAccount) {
                  repositoryNotice
                      .text("The main repository. Touch only with permission.")
                      .show();
              } else {
                  repositoryNotice.hide().text("");
              }
          
              if (savedDisplayName) {
                  welcomeMessage
                      .text("Welcome, " + savedDisplayName + "!")
                      .fadeIn(180);
          
                  window.welcomeMessageTimer = setTimeout(() => {
                      welcomeMessage.fadeOut(180);
                  }, 3000);
              }
          
              $("#authContainer").hide();
              $("#dashboard").show();
              await initializeProjects(user);
          
              // Ask for a local alias once; this guard prevents duplicate prompts during repeated dashboard calls.
              if (!savedDisplayName && pendingProjectAction?.type !== "display-name") {
                  pendingProjectAction = { type: "display-name", userId: user.id };
                  projectDialogTitle.textContent = "Choose your display name";
                  projectDialogMessage.textContent = "Choose the name shown in this browser. You can use the same name as your account.";
                  projectNameInput.hidden = false;

              scheduleCodeCheck();
          });
          // Keep the visible Prism layer at the same scroll position as the transparent textarea.
          codeInput.on("scroll", function() {
              $(".code-highlight").scrollTop(codeInput.scrollTop());
              $(".code-highlight").scrollLeft(codeInput.scrollLeft());
          });
          
          // Render the initial textarea content once the DOM and Prism library are ready.
          updateCodeHighlight();
          
          // Delegate tab clicks from the stable container because tabs are rebuilt dynamically.
          $("#projectTabs").on("click", ".project-tab-button", function() {
              activateProject(this.closest(".project-tab").dataset.projectId);
          });
          
          // A double-click on a tab name opens the rename dialog.
          $("#projectTabs").on("dblclick", ".project-tab-button", function() {
              renameProject(this.closest(".project-tab").dataset.projectId);
          });
          
          // The tab's close button begins the delete flow.
          $("#projectTabs").on("click", ".project-close-button", function() {
              deleteProject(this.closest(".project-tab").dataset.projectId);
          });
          
          // Start dragging by recording the project ID and creating a same-width insertion ghost.
          // event carries the browser drag data used to move the selected project tab.
          $("#projectTabs").on("dragstart", ".project-tab", function(event) {
              draggedProjectId = this.dataset.projectId;
              this.classList.add("is-dragging");
              const dragEvent = event.originalEvent || event; // Use the browser event to access its DataTransfer object.
              dragEvent.dataTransfer.effectAllowed = "move";
              dragEvent.dataTransfer.setData("text/plain", draggedProjectId);
              projectDropGhost = document.createElement("div");
              projectDropGhost.className = "project-tab-ghost";
              projectDropGhost.setAttribute("aria-hidden", "true");
              projectDropGhost.textContent = projects.find(project => project.id === draggedProjectId)?.name || "";
              projectDropGhost.style.width = this.getBoundingClientRect().width + "px";
              updateProjectDropGhost(dragEvent.clientX);
          });
          
          // Move the ghost as the pointer passes between tab centers.
          // event supplies pointer coordinates so the insertion ghost can track the cursor.
          $("#projectTabs").on("dragover", function(event) {
              if (!draggedProjectId || !projectDropGhost) return;
              event.preventDefault();
              updateProjectDropGhost((event.originalEvent || event).clientX);
          });
          
          // Convert the ghost's visual position into an array index and persist the reordered projects.
          // event marks the drop and provides the final visual order to save.
          $("#projectTabs").on("drop", function(event) {
              if (!draggedProjectId || !projectDropGhost) return;
              event.preventDefault();
              const childElements = Array.from(this.children); // Current visual order, including the ghost.
              const ghostIndex = childElements.indexOf(projectDropGhost); // Position where the dragged project belongs.
              const destinationIndex = childElements
                  .slice(0, ghostIndex)
                  .filter(element => element.classList.contains("project-tab") && element.dataset.projectId !== draggedProjectId)
                  .length;
              const sourceId = draggedProjectId; // Preserve the ID before clearing drag state.
          
              clearProjectDragState();
              moveProjectToIndex(sourceId, destinationIndex);
          });
          
          // Clean up if a drag ends without a successful drop.
          $("#projectTabs").on("dragend", ".project-tab", function() {
              clearProjectDragState();
          });
          
          // Replace the browser menu only when the pointer is over a project tab.
          // event is canceled only on project tabs so other page areas keep their native context menu.
          $("#projectTabs").on("contextmenu", ".project-tab", function(event) {
              event.preventDefault();
              contextProjectId = this.dataset.projectId;
              updateProjectMoveActions(contextProjectId);
              projectContextMenu.hidden = false;
          
              const pointer = event.originalEvent || event; // Native pointer coordinates for menu placement.
              const left = Math.min(pointer.clientX, window.innerWidth - projectContextMenu.offsetWidth - 8); // Keep menu inside the right edge.
              const top = Math.min(pointer.clientY, window.innerHeight - projectContextMenu.offsetHeight - 8); // Keep menu inside the bottom edge.
              projectContextMenu.style.left = Math.max(8, left) + "px";
              projectContextMenu.style.top = Math.max(8, top) + "px";
              projectContextMenu.querySelector("[data-project-action='rename']").focus();
          });
          
          // Route menu buttons to move, rename, or delete the project that opened the menu.
          $("#projectContextMenu").on("click", "[data-project-action]", function() {
              const projectId = contextProjectId; // Target selected when the context menu opened.
              const action = this.dataset.projectAction; // Action name stored on the clicked menu item.
          
              if (action === "move-left" || action === "move-right") {
                  moveProject(projectId, action === "move-left" ? -1 : 1);
                  updateProjectMoveActions(projectId);
                  return;
              }
          
              hideProjectContextMenu();
          
              if (action === "rename") renameProject(projectId);
              if (action === "delete") deleteProject(projectId);
          });
          
          // Close the project menu when the user clicks anywhere outside it.
          $(document).on("click", function(event) {
              if (!projectContextMenu.hidden && !projectContextMenu.contains(event.target)) {
                  hideProjectContextMenu();
              }
          });
          
          // Escape closes ordinary dialogs and menus, but the required first display-name prompt stays open.
          // event.key identifies Escape, which closes dismissible menus and dialogs.
          $(document).on("keydown", function(event) {
              if (event.key === "Escape" && !projectDialog.hidden) {
                  if (pendingProjectAction?.type === "display-name") {
                      event.preventDefault();
                      return;
                  }
                  closeProjectDialog();
                  return;
              }
          
              if (event.key === "Escape" && !projectContextMenu.hidden) {
                  hideProjectContextMenu();
              }
          });
          
          // No parameters; creates a uniquely named starter project and activates it.
          // Create a starter project and activate it; both plus buttons use this function.
          function createProject() {
              saveActiveProject();
              const project = { // New projects begin with the starter HTML and an empty preview.
                  id: crypto.randomUUID(),
                  name: nextProjectName(),
                  code: starterCode,
                  output: ""
              };
              projects.push(project);
              activeProjectId = null;
              activateProject(project.id);
          }
          
          // Share one creation handler between the normal tab-bar button and the empty-state button.
          $("#newProjectButton, #emptyNewProjectButton").on("click", createProject);
          
          // Run the current HTML in the sandboxed iframe, then save the rendered source with its project.
          $("#runCodeButton").off("click").on("click", function() {
              codeOutput.attr("srcdoc", codeInput.val());
              saveActiveProject();
          });
          
          // No parameters; returns the cached validator-loading promise or creates it on first use.
          // Load the browser-compatible HTML validator only when needed and reuse its promise.
          function getHtmlValidator() {
              if (!htmlValidatorPromise) {
                  // Dynamic import avoids loading the validator until an automatic check is scheduled.
                  htmlValidatorPromise = import("https://esm.sh/html-validate@11.22.1/browser")
                      .then(({ HtmlValidate }) => new HtmlValidate({ extends: ["html-validate:recommended"] }))
                      .catch(error => {
                          htmlValidatorPromise = null;
                          throw error;
                      });
              }
          
              return htmlValidatorPromise;
          }
          
          // messages: list of validator issues; errorCount and warningCount: totals shown in the summary.
          // Replace the diagnostics panel with a summary and one clickable row per validator message.
          function showCodeDiagnostics(messages, errorCount, warningCount) {
              diagnosticsList.replaceChildren();
              codeDiagnostics.hidden = false;
          
              if (errorCount === 0 && warningCount === 0) {
                  diagnosticsSummary.textContent = "No HTML issues found.";
                  return;
              }
          
              diagnosticsSummary.textContent = errorCount + (errorCount === 1 ? " error" : " errors") +
                  (warningCount ? " · " + warningCount + (warningCount === 1 ? " warning" : " warnings") : "");
          
              messages.forEach(message => { // Build safe DOM elements instead of inserting validator text as HTML.
                  const row = document.createElement("li"); // List item for one issue.
                  const button = document.createElement("button"); // Clicking it moves the caret to the issue.
                  button.type = "button";
                  button.className = "diagnostic-item" + (message.severity === 1 ? " is-warning" : "");
                  button.dataset.offset = String(message.offset ?? 0);
                  button.dataset.size = String(message.size ?? 0);
          
                  const location = document.createElement("span"); // Validator's 1-based line and column.
                  location.className = "diagnostic-location";
                  location.textContent = "L" + message.line + ":" + message.column;
          
                  const description = document.createElement("span"); // Human-readable explanation of the issue.
                  description.textContent = message.message;
                  button.append(location, description);
                  row.appendChild(button);
                  diagnosticsList.appendChild(row);
              });
          }
          
          function scheduleCodeCheck() {
              // No parameters; debounce validation while typing and invalidate any older check still in flight.
              clearTimeout(codeCheckTimer);
              const revision = ++codeCheckRevision; // A unique version lets older asynchronous runs detect they are stale.
              codeCheckTimer = setTimeout(() => runCodeCheck(revision), 500);
          }
          
          // revision: scheduled-check token used to reject results made stale by edits or tab switches.
          // Validate a snapshot and display it only if the editor still contains that same project and source.
          async function runCodeCheck(revision) {
              const source = codeInput.val(); // Immutable source snapshot for this asynchronous check.
              const checkedProjectId = activeProjectId; // Avoid showing results on a different project tab.
          
              try {
                  const validator = await getHtmlValidator(); // Ready-to-use HTML validator instance.
                  const report = await validator.validateString(source, "project.html"); // Parse and check this snapshot as HTML.
                  if (revision !== codeCheckRevision || checkedProjectId !== activeProjectId || source !== codeInput.val()) return;
          
                  const messages = report.results.flatMap(result => result.messages || []); // Combine messages from every report entry.
                  showCodeDiagnostics(messages, report.errorCount, report.warningCount);
              } catch (error) {
                  if (revision !== codeCheckRevision || checkedProjectId !== activeProjectId || source !== codeInput.val()) return;
          
                  // Convert a CDN or validator failure into a visible diagnostic rather than failing silently.
                  console.error("HTML validation failed:", error);
                  showCodeDiagnostics([{
                      line: 1,
                      column: 1,
                      offset: 0,
                      size: 0,
                      severity: 2,
                      message: "The HTML validator could not load. Check your internet connection and try again."
                  }], 1, 0);
              }
          }
          
          // Turn a diagnostic click into a selection at the reported character offset.
          $("#codeDiagnostics").on("click", ".diagnostic-item", function() {
              const editor = codeInput[0]; // Native textarea needed by the selection API.
              const start = Math.min(Number(this.dataset.offset) || 0, editor.value.length); // Clamp to valid source bounds.
              const end = Math.min(start + (Number(this.dataset.size) || 0), editor.value.length); // End of issue selection.
              editor.focus();
              editor.setSelectionRange(start, end);
          });
          
          // popup: notification element to animate and remove.
          // Animate a notification out, then remove it even if the browser skips transitionend.
          function dismissPopup(popup) {
              if (!popup || popup.classList.contains("is-leaving")) return;
          
              popup.classList.remove("is-visible");
              popup.classList.add("is-leaving");
          
              // Remove the notification as soon as its movement or fade finishes.
              popup.addEventListener("transitionend", function handleTransitionEnd(event) {
                  if (event.propertyName === "transform" || event.propertyName === "opacity") {
                      popup.remove();
                  }
              }, { once: true });
          
              setTimeout(() => popup.remove(), 350); // Fallback cleanup if no transition event is fired.
          }
          
          // message: text to show; type: "success" or "error" selects its visual state.
          // Create a success/error notification with a close button and automatic four-second dismissal.
          function showPopup(message, type = "success") {
              const popupStack = document.getElementById("popupStack"); // Shared container that stacks notifications.
          
              const popup = document.createElement("div"); // New independent notification element.
              popup.className = "popup is-visible " + (type === "error" ? "is-error" : "is-success");
              popup.setAttribute("role", "status");
          
              const text = document.createElement("span"); // Text node container avoids treating messages as HTML.
              text.textContent = message;
          
              const closeButton = document.createElement("button"); // Accessible manual-dismiss control.
              closeButton.type = "button";
              closeButton.className = "popup-close";
              closeButton.setAttribute("aria-label", "Close");
              closeButton.textContent = "×";
              closeButton.addEventListener("click", () => dismissPopup(popup));
          
              popup.append(text, closeButton); // Add both controls before inserting the popup into the page.
              popupStack.appendChild(popup);
          
              requestAnimationFrame(() => popup.classList.add("is-visible")); // Start the entrance animation on the next frame.
              setTimeout(() => dismissPopup(popup), 4000);
          }
        </script>
    </body>
</html>
